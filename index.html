<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Interactief Domotica Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .toggle-checkbox:checked + .toggle-label {
      background-color: #10B981; /* Tailwind green-500 */
    }
    .toggle-checkbox:checked + .toggle-label .toggle-dot {
      transform: translateX(1.25rem); /* Tailwind translate-x-5 */
    }
    .weather-code-green { background-color: #008000 !important; }
    .weather-code-yellow { background-color: #ffd700 !important; }
    .weather-code-red { background-color: #CC0000 !important; }
    .weather-code-none { background-color: #e5e7eb !important; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-blue-600 text-white p-4 shadow-md">
    <h1 class="text-2xl font-bold">Interactief Domotica Dashboard</h1>
  </header>

  <main class="flex-1 p-4 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    <!-- Weather Section -->
    <section class="bg-white rounded-lg shadow p-4 flex flex-col">
      <h2 class="text-xl font-semibold mb-2">Weersvoorspelling Kerkrade</h2>
      
      <!-- KNMI Weather Alarm Code -->
      <div id="weather-alarm" class="mb-4 p-3 rounded-lg text-white font-bold text-center transition-colors duration-300 weather-code-none">
        <span id="weather-alarm-code">Geen code</span>
        <p id="weather-alarm-desc" class="text-sm font-normal mt-1">Geen weerswaarschuwing</p>
      </div>

      <div id="weather" class="flex items-center space-x-4">
        <div class="text-5xl" id="weather-icon">☀️</div>
        <div>
          <p class="text-2xl" id="temp">--°C</p>
          <p class="text-gray-600" id="description">--</p>
        </div>
      </div>

      <!-- Buienalarm Rain Expected -->
      <div class="mt-4 p-3 bg-blue-50 rounded-lg border border-blue-200">
        <h3 class="text-sm font-medium text-blue-800 mb-1">Buienalarm: Verwachte neerslag</h3>
        <p class="text-lg font-bold text-blue-900">
          <span id="rain-expected">0</span> mm
        </p>
      </div>

      <div class="mt-4">
        <h3 class="text-sm font-medium text-gray-700 mb-2">Uurlijkse voorspelling</h3>
        <div id="hourly-forecast" class="flex space-x-4 overflow-x-auto pb-2">
          <!-- Hourly forecast items will be populated by JS -->
        </div>
      </div>
      <canvas id="tempChart" class="mt-4"></canvas>
    </section>

    <!-- Energy Consumption Section -->
    <section class="bg-white rounded-lg shadow p-4 flex flex-col">
      <h2 class="text-xl font-semibold mb-2">Energieverbruik</h2>
      <canvas id="energyChart" class="flex-1"></canvas>
    </section>

    <!-- Devices Control Section -->
    <section class="bg-white rounded-lg shadow p-4">
      <h2 class="text-xl font-semibold mb-4">Apparaten</h2>
      <div class="space-y-4">
        <!-- Example device -->
        <div class="flex items-center justify-between">
          <span class="font-medium">Verlichting woonkamer</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only toggle-checkbox" data-device="light_living" checked>
            <div class="toggle-label w-11 h-6 bg-gray-300 rounded-full transition-colors duration-200">
              <div class="toggle-dot absolute left-0 top-0 w-5 h-5 bg-white rounded-full shadow transform transition-transform duration-200"></div>
            </div>
          </label>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-medium">Verwarming</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only toggle-checkbox" data-device="heater" checked>
            <div class="toggle-label w-11 h-6 bg-gray-300 rounded-full transition-colors duration-200">
              <div class="toggle-dot absolute left-0 top-0 w-5 h-5 bg-white rounded-full shadow transform transition-transform duration-200"></div>
            </div>
          </label>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-medium">Garden sprinkler</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only toggle-checkbox" data-device="sprinkler">
            <div class="toggle-label w-11 h-6 bg-gray-300 rounded-full transition-colors duration-200">
              <div class="toggle-dot absolute left-0 top-0 w-5 h-5 bg-white rounded-full shadow transform transition-transform duration-200"></div>
            </div>
          </label>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Mock weather data for Kerkrade
    const weatherData = {
      current: {
        temp: 18,
        description: "Zonnig",
        icon: "☀️"
      },
      hourly: [
        { time: "14:00", temp: 18, icon: "☀️", rain: 0 },
        { time: "15:00", temp: 19, icon: "☀️", rain: 0 },
        { time: "16:00", temp: 18, icon: "⛅", rain: 0 },
        { time: "17:00", temp: 17, icon: "🌧️", rain: 2 },
        { time: "18:00", temp: 16, icon: "🌧️", rain: 5 },
        { time: "19:00", temp: 15, icon: "🌧️", rain: 8 },
        { time: "20:00", temp: 14, icon: "🌧️", rain: 12 },
        { time: "21:00", temp: 13, icon: "🌧️", rain: 15 }
      ],
      // Buienalarm data: total expected rain in mm
      buienalarm: {
        totalRain: 42
      },
      // KNMI Weather Alarm
      knmiAlarm: {
        code: "Code geel",
        description: "Waarschuwing voor zware buien en onweer in de regio Limburg."
      }
    };

    // Initialize Weather Display
    function initWeather() {
      // Current Weather
      document.getElementById('temp').textContent = weatherData.current.temp + '°C';
      document.getElementById('description').textContent = weatherData.current.description;
      document.getElementById('weather-icon').textContent = weatherData.current.icon;

      // Buienalarm Rain Expected
      document.getElementById('rain-expected').textContent = weatherData.buienalarm.totalRain;

      // KNMI Weather Alarm
      const alarmCode = weatherData.knmiAlarm.code;
      const alarmDesc = weatherData.knmiAlarm.description;
      const alarmElement = document.getElementById('weather-alarm');
      const codeElement = document.getElementById('weather-alarm-code');
      const descElement = document.getElementById('weather-alarm-desc');

      codeElement.textContent = alarmCode;
      descElement.textContent = alarmDesc;

      // Remove all color classes
      alarmElement.classList.remove('weather-code-green', 'weather-code-yellow', 'weather
